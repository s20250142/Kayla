<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Curio</title>
  <link rel="icon" href="https://s20250142.github.io/Kayla/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://s20250142.github.io/Kayla/site.css">
  <style>
    .notfound { min-height: 72vh; display: grid; place-items: center; padding: 40px 24px; text-align: center; }
    .notfound-inner { max-width: 620px; }
    .notfound h1 { font-size: clamp(36px, 6vw, 64px); margin: 16px 0 14px; }
    .notfound p { color: var(--muted); margin-bottom: 12px; }
    .notfound .zh { font-size: 14px; line-height: 1.8; }
    .notfound-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
  </style>
</head>
<body>
  <main class="notfound">
    <div class="notfound-inner">
      <span class="brand-mark" style="margin:0 auto 18px;">C</span>
      <span class="eyebrow">404 · Page not found</span>
      <h1>This page wandered off.</h1>
      <p>The page you are looking for does not exist. The app is still here.</p>
      <p class="zh">找不到這個頁面。應用程式仍然可以使用。</p>
      <p style="font-size:11px; margin-top:18px;">Created by Wong Tsz Ching · Class 2C</p>
      <div class="notfound-actions">
        <a class="btn btn-primary" href="https://s20250142.github.io/Kayla/">Back to the website</a>
        <a class="btn btn-ghost" href="https://s20250142.github.io/Kayla/app/">Open the app</a>
      </div>
    </div>
  </main>
</body>
</html>
